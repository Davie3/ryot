# Davie3/ryot fork: open a PR into `fork` for each new upstream release tag. The PR's head
# is the upstream tag itself, so merging it brings in exactly that release. See FORK.md.
name: Fork sync

on:
  schedule:
    - cron: "7 10 * * *"
  workflow_dispatch:

permissions:
  contents: write # push sync/vX.Y.Z
  pull-requests: write # open the PR

concurrency:
  group: fork-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Open a PR for the newest upstream release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          git fetch --no-tags --force https://github.com/IgnisDa/ryot.git '+refs/tags/v*:refs/tags/v*'
          tag=$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if git merge-base --is-ancestor "$tag" HEAD; then
            echo "$tag is already in fork"
            exit 0
          fi
          branch="sync/$tag"
          # Any PR for this tag, open or closed: a closed one means it was turned down.
          if [[ -n "$(gh pr list -R "$REPO" --head "$branch" --state all --json number -q '.[].number')" ]]; then
            echo "A PR for $tag already exists"
            exit 0
          fi
          remote="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          if git ls-remote --exit-code --heads "$remote" "$branch" >/dev/null; then
            echo "$branch is already pushed"
          elif ! git push "$remote" "$(git rev-parse "$tag^{commit}"):refs/heads/$branch"; then
            # The Actions token can't push commits that change .github/workflows/.
            echo "::error::Couldn't push $branch, most likely because $tag changes upstream's workflow files. From a clone: git fetch upstream --tags && git push origin '$tag^{commit}:refs/heads/$branch', then run this workflow again."
            exit 1
          fi
          current=$(git tag --merged HEAD --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          gh pr create -R "$REPO" --base fork --head "$branch" \
            --title "chore(fork): sync upstream $tag" \
            --body "$(printf '%s\n' \
              "Merges upstream release \`$tag\` into \`fork\` (currently \`$current\`)." \
              "" \
              "- Upstream changes: https://github.com/IgnisDa/ryot/compare/$current...$tag" \
              "- Nothing builds until this is merged; the merge runs \`Fork image\`, which smoke-tests and publishes \`$tag\`." \
              "- If it conflicts, resolve it on \`$branch\` and keep \`is_server_key_validated: true,\`." \
              "- Merge with a merge commit (squash and rebase are disabled), so the tag stays in \`fork\`'s history.")"
